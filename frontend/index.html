<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
      
  <div class="form">
    <h2>Formulário de Alunos</h2>
    <div class="alunos-form">
      <table id="tabelaAlunos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Matrícula</th>
            <th>Telefone</th>
            <th>Data Nascimento</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="formulario-aluno">
        <label for="nome">Nome:</label><input type="text" id="nome" placeholder="Nome">
        <label for="matricula">Matrícula:</label><input type="text" id="matricula" placeholder="Matrícula">
        <label for="telefone">Telefone:</label><input type="text" id="telefone" placeholder="Telefone">
        <label for="dataNascimento">Data Nascimento:</label><input type="date" id="dataNascimento">
      </div>
    </div>

    <div class="botoes">
      <button id="btnIncluir">Incluir</button>
      <button id="btnInicio">Início</button>
      <button id="btnVoltar">Voltar</button>
      <button id="btnAvancar">Avançar</button>
      <button id="btnFim">Fim</button>
      <button id="btnDeletar">Deletar</button>
      <button id="btnImprimir">Imprimir</button>
      <button onclick="window.location.href='curso.html'">Curso</button>
    </div>
  </div>
  <script type="module" src="js/script.js"></script>
</body>
</html>
